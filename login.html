<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Huancayo - Bienvenido Colaborador</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">
            <!-- Columna Izquierda: Imagen / Ilustración -->
            <div class="col-lg-7 d-none d-lg-block illustration-container">
                <!-- Nota: Reemplaza 'plaza-huancayo.jpg' por la ruta de tu imagen de la plaza -->
            <img src="img/plaza2.jpg" alt="plaza plaza-huancayo" class="w-100 h-100 object-fit-cover">
            </div>

            <!-- Columna Derecha: Formulario de Login -->
            <div class="col-lg-5 d-flex align-items-center justify-content-center bg-white px-4 py-5">
                <div class="login-card w-100">
                    
                    <!-- Logo y Cabecera -->
                    <div class="text-center mb-4">
                        <!-- Logo simulado de Caja Huancayo (puedes cambiarlo por una etiqueta <img> si tienes el archivo) -->
                        <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                            <span class="badge-logo bg-danger text-white p-1 rounded">🏛️</span>
                            <h4 class="fw-bold m-0 text-brand-dark">Caja Huancayo</h4>
                        </div>
                        <h5 class="fw-bold text-dark mt-3">Bienvenido Colaborador</h5>
                        <p class="text-muted small">Ingrese sus credenciales</p>
                    </div>

                    <!-- Formulario -->
                    <form>
                        <!-- Campo Usuario -->
                        <div class="mb-3">
                            <div class="input-group custom-input-group">
                                <input type="text" class="form-control border-end-0" placeholder="Usuario" required>
                                <span class="input-group-text bg-transparent border-start-0 text-muted">
                                    <i class="bi bi-person"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Campo Contraseña -->
                        <div class="mb-3">
                            <div class="input-group custom-input-group">
                                <input type="password" class="form-control border-end-0" placeholder="Contraseña" required>
                                <span class="input-group-text bg-transparent border-start-0 text-muted" role="button">
                                    <i class="bi bi-eye-slash"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Recordar usuario y ¿Olvidó sus credenciales? -->
                        <div class="d-flex justify-content-between align-items-center mb-3 text-small">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="rememberUser">
                                <label class="form-check-label text-muted" for="rememberUser">Recordar usuario</label>
                            </div>
                            <a href="#" class="text-decoration-none text-muted small">¿Olvidó sus credenciales?</a>
                        </div>

                        <!-- Simulación Captcha -->
                        <div class="mb-4">
                            <div class="border rounded p-2 bg-light d-flex align-items-center justify-content-between">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="notRobot" required>
                                    <label class="form-check-label small text-secondary" for="notRobot">
                                        No soy un robot
                                    </label>
                                </div>
                                <div class="text-center">
                                    <small class="text-muted d-block" style="font-size: 10px;">reCAPTCHA</small>
                                </div>
                            </div>
                        </div>

                        <!-- Botón Ingresar -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger btn-login fw-semibold py-2">Ingresar</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
